name: Verify Triper Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Show dist folder
        run: |
          echo "=== DIST CONTENTS ==="
          ls -R ./dist

      - name: Check for triper.js in dist
        run: |
          if [ ! -f "./dist/triper.js" ]; then
            echo "❌ triper.js is missing from the build output!"
            exit 1
          else
            echo "✅ triper.js found in dist/"
          fi
