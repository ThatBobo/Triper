name: Verify Triper Script Exists

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for triper.js in public/
        run: |
          echo "=== PUBLIC CONTENTS ==="
          ls -R ./public

          if [ ! -f "./public/triper.js" ]; then
            echo "❌ triper.js is missing from public/"
            exit 1
          else
            echo "✅ triper.js found in public/"
          fi
